<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheoriaBrowser</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <header>
    <h1>TheoriaBrowser</h1>
    <span class="subtitle">Theoria Chess Engine in the Browser</span>
  </header>

  <main>
    <div id="eval-bar-container">
      <div id="eval-bar">
        <div id="eval-bar-fill"></div>
        <div id="eval-bar-label">0.0</div>
      </div>
    </div>

    <div id="board-container">
      <div id="chessboard"></div>
    </div>

    <div id="analysis-panel">
      <h3>Analysis</h3>
      <div id="engine-status">Engine: loading...</div>
      <div id="search-info">
        <span id="depth-display">Depth: -</span>
        <span id="nodes-display">Nodes: -</span>
        <span id="nps-display">NPS: -</span>
      </div>
      <div id="pv-lines"></div>
    </div>
  </main>

  <div id="move-list-container">
    <div id="move-list"></div>
  </div>

  <div id="controls">
    <button id="btn-chesscom">Chess.com</button>
    <button id="btn-new">New</button>
    <button id="btn-flip">Flip</button>
    <button id="btn-undo">Undo</button>
    <span class="engine-mode-label">Engine:</span>
    <button id="btn-mode-theoria" class="active">Theoria</button>
    <button id="btn-mode-fast">Fast</button>
    <button id="btn-analysis">Analysis: Off</button>
    <label>
      Depth: <input type="range" id="depth-slider" min="1" max="30" value="20" />
      <span id="depth-value">20</span>
    </label>
    <label>
      MultiPV: <select id="multipv-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
  </div>

  <!-- Chess.com import modal -->
  <div id="chesscom-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>Import from Chess.com</h2>
      <div class="modal-body">
        <div id="chesscom-search">
          <input id="chesscom-username" type="text" placeholder="Chess.com username" autocomplete="off" spellcheck="false" />
          <button id="chesscom-fetch">Fetch games</button>
        </div>
        <div id="chesscom-status" class="modal-status"></div>
        <div id="chesscom-games"></div>
      </div>
      <button id="chesscom-close" class="modal-close" aria-label="Close">&times;</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
